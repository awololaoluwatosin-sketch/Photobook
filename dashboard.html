<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>License dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--mute:#6b7280;--line:#e3e6eb;--acc:#3b5bdb;--ok:#127a43;--okbg:#e3f5ea;--bad:#b42318;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff3d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--ink:#eceef2;--mute:#9aa1ad;--line:#2a2f38;--acc:#7b93ff;--ok:#5fd394;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1714;--warn:#f2c46b;--warnbg:#3a2d10}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}h1{font-size:20px;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}.stat{padding:14px 16px}.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.active{background:var(--okbg);color:var(--ok)}.pill.revoked{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.mute{color:var(--mute)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.devs{background:var(--bg);padding:6px 14px 12px}.dev{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.dev:last-child{border:0}
.login{max-width:380px;margin:12vh auto;padding:24px}.login h1{margin-bottom:6px}.login input{width:100%;margin:14px 0 10px}.msg{min-height:20px;color:var(--bad);margin-top:8px}.msg.ok{color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:520px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:12px 0 4px;font-weight:600}dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.scroll{overflow-x:auto}.empty{padding:28px;text-align:center;color:var(--mute)}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="/dashboard.js"></script>
</body></html>
